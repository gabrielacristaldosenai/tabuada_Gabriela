<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuadas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans+Math&family=Press+Start+2P&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <style>
        body{
            background: rgb(219, 168, 239);
            font-family: "Noto Sans Math", sans-serif;
        }
        #num, #calcular{
            width: 80px;
            background: rgb(219, 168, 239);
        }
        #centro{
            width: 500px;
            margin: 0 auto;
            text-align: center;
            background: rgb(111, 65, 120);
            padding-bottom: 20px;
            border-radius: 10px;
            box-shadow: rgb(212, 0, 255) 0 5px 7px;
        }
        h1, #resultado{
            color: rgb(219, 168, 239);
            font-size: 30px;
        }
    </style>
</head>
<body>
    <div id="centro">
        <h1>Descubra a Tabuada de Qualquer Número</h1>
        <input type="number" name="num" id="num">
        <input type="button" value="Calcular" id="calcular"><br><br>

        <div id="resultado"></div>
    </div>

<script src="script.js"></script>
</body>
</html>
